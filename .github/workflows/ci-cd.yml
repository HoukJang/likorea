name: CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18.x'

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm install
    
    - name: Run backend lint
      working-directory: ./backend
      run: npm run lint
    
    - name: Run backend tests
      working-directory: ./backend
      env:
        NODE_ENV: test
        JWT_SECRET: test-secret
        MONGO_URI: mongodb://localhost:27017/test
      run: npm test
    
    - name: Upload backend coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-coverage
        path: backend/coverage

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm install
    
    - name: Run frontend lint
      working-directory: ./frontend
      run: npm run lint
    
    - name: Run frontend tests
      working-directory: ./frontend
      env:
        CI: true
        REACT_APP_BACKEND_URL: http://localhost:5001
      run: npm test -- --passWithNoTests
    
    - name: Build frontend
      working-directory: ./frontend
      env:
        # 프로젝트는 ESLint 경고 모드(점진 적용) — CI=true면 CRA가 경고를 에러로 격상시켜 빌드가 실패함
        CI: false
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/build

  # main 푸시 → 테스트 통과 시 버전 bump + release 커밋 + 태그 푸시.
  # 서버의 likorea-deploy.timer가 태그 달린 release 커밋을 감지해 자동 배포한다.
  # 기본 patch bump. 커밋 메시지에 [minor] 또는 [major] 포함 시 해당 레벨로 bump.
  release:
    name: Release (bump version & tag)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release')"
    permissions:
      contents: write
    concurrency:
      group: release

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Bump version, commit and tag
      env:
        HEAD_MSG: ${{ github.event.head_commit.message }}
      run: |
        BUMP=patch
        case "$HEAD_MSG" in
          *"[major]"*) BUMP=major ;;
          *"[minor]"*) BUMP=minor ;;
        esac
        node scripts/version-manager.js bump "$BUMP"
        VERSION=$(node -e "console.log(require('./version.json').version)")
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add version.json package.json backend/package.json frontend/package.json
        git commit -m "chore: release v${VERSION}"
        git tag -a "v${VERSION}" -m "Release v${VERSION}"
        git push origin main --follow-tags
        echo "Released v${VERSION} — server auto-deploys within ~2 minutes"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security audit - Backend
      working-directory: ./backend
      run: npm audit --audit-level=high
      continue-on-error: true
    
    - name: Run security audit - Frontend
      working-directory: ./frontend
      run: npm audit --audit-level=high
      continue-on-error: true